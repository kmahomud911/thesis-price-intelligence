[tool.poetry]
name = "feature-pipeline"
version = "0.1.0"
description = "Shared feature computation — single source of truth for all features across causal and forecast pipelines"
authors = ["Khandoker Shawon Mahomud <kmahomud911@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"

# API
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"

# Causal Inference — core of this service
econml = "^0.15.1"
scikit-learn = "^1.4.2"
statsmodels = "^0.14.2"

# Data
numpy = "^1.26.4"
pandas = "^2.2.2"
pyarrow = "^16.0.0"

# Kafka consumer
confluent-kafka = "^2.4.0"

# Database
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.30"

# MLflow
mlflow = "^2.22.0"

# Observability
prometheus-fastapi-instrumentator = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"
black = "^24.4.2"
ruff = "^0.4.4"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"