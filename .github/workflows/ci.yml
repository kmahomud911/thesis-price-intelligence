name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ══════════════════════════════════════════
  # JAVA BUILD + TEST
  # ══════════════════════════════════════════
  java-build:
    name: Java Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test all Java services
        run: mvn clean verify --batch-mode
        working-directory: .

      - name: Checkstyle lint
        run: mvn checkstyle:check --batch-mode
        working-directory: .

  # ══════════════════════════════════════════
  # PYTHON LINT + TEST
  # ══════════════════════════════════════════
  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - ml/causal-estimation-service
          - ml/demand-forecast-service
          - ml/feature-pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Install dependencies
        run: poetry install --with dev --no-interaction
        working-directory: ${{ matrix.service }}

      - name: Ruff lint
        run: poetry run ruff check app/
        working-directory: ${{ matrix.service }}

      - name: Black format check
        run: poetry run black --check app/
        working-directory: ${{ matrix.service }}

      - name: Pytest
        run: poetry run pytest tests/ -v
        working-directory: ${{ matrix.service }}

  # ══════════════════════════════════════════
  # DOCKER BUILD
  # ══════════════════════════════════════════
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [java-build, python-lint-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build causal-estimation-service
        uses: docker/build-push-action@v5
        with:
          context: ml/causal-estimation-service
          push: false
          tags: causal-estimation-service:ci

      - name: Build demand-forecast-service
        uses: docker/build-push-action@v5
        with:
          context: ml/demand-forecast-service
          push: false
          tags: demand-forecast-service:ci

      - name: Build feature-pipeline
        uses: docker/build-push-action@v5
        with:
          context: ml/feature-pipeline
          push: false
          tags: feature-pipeline:ci

  # ══════════════════════════════════════════
  # SMOKE TEST
  # ══════════════════════════════════════════
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > infra/.env << EOF
          POSTGRES_DB=thesis
          POSTGRES_USER=thesis_user
          POSTGRES_PASSWORD=thesis_pass
          MINIO_ROOT_USER=minio_user
          MINIO_ROOT_PASSWORD=minio_pass123
          GF_SECURITY_ADMIN_PASSWORD=admin
          EOF

      - name: Start infrastructure
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Wait for services
        run: sleep 60

      - name: Check TimescaleDB
        run: |
          docker exec thesis-timescaledb pg_isready -U thesis_user -d thesis

      - name: Check Kafka topics
        run: |
          docker exec thesis-kafka kafka-topics --bootstrap-server localhost:9092 --list

      - name: Check Schema Registry
        run: |
          curl -f http://localhost:8090/subjects

      - name: Check MLflow
        run: |
          curl -f http://localhost:5000/health

      - name: Check Grafana
        run: |
          curl -f http://localhost:3000/api/health

      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v